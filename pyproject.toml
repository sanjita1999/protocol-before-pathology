[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmvf-clinical-speech"
version = "1.0.0"
description = "Protocol-Conditioned Measurement Validity Framework (PCMVF) for clinical-speech benchmarks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "tqdm>=4.66",
  "Jinja2>=3.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
analysis = ["shap>=0.44", "xgboost>=2.0"]
audio = ["torch>=2.0", "torchaudio>=2.0", "transformers>=4.40", "soundfile>=0.12", "opensmile>=2.5"]

[project.scripts]
speech-atlas = "clinical_speech_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
